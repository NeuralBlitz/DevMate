# Keep routine version upgrades reviewable. Dependabot security updates are
# separate from routine version updates and are not blocked by ignore rules.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/neuralblitz-x3"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
